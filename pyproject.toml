[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-events"
version = "0.1.0"
description = "Event study of how gold and silver react to geopolitical and policy events, controlling for real yields and the dollar."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "requests>=2.28",
    "yfinance>=0.2",
    "xlrd>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["gold_events"]

[tool.pytest.ini_options]
testpaths = ["tests"]
