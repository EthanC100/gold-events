name: Weekly forward log

on:
  schedule:
    - cron: "0 0 * * 1"   # every Monday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Log this week
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: python log_week.py

      - name: Score prior weeks
        run: python score_week.py

      - name: Commit the new row
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forward_log.csv reports/forward_scorecard.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Weekly forward log: $(date -u +%Y-%m-%d)"
            git push
          fi
